[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settlement-operations-dashboard"
version = "1.0.0"
description = "Synthetic settlement operations cutoff, SLA, exception, and KPI monitoring pipeline"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
